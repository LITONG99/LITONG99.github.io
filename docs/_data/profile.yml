short_bio: >-
  <p>
    Thanks for visiting my page! Please feel free to reach out <a class="contact-envelope" href="mailto:tlice@connect.ust.hk" aria-label="Email Tong Li"><i class="fa-solid fa-envelope" aria-hidden="true"></i></a>.
  </p>
  <p>
    I am a year-3 PhD candidate at the Hong Kong University of Science and Technology, co-supervised by <a href="https://researchportal.hkust.edu.hk/en/persons/bo-li/">Prof. Bo Li</a> and <a href="https://personal.hkust-gz.edu.cn/Chenlei/">Prof. Lei Chen</a>.
  </p>
  <p>
    I study <strong>data preparation and management</strong> at the intersection of
    databases and LLMs. I provide LLM-based solutions to automate structured data preparation and develop methods for LLM to use the data more smartly.
    My work connects unstructured text, structured databases, and data-driven applications.
  </p>
  <p>
    My recent work focuses on <strong>data profiling and metadata generation</strong>, which serve as important
    contextual interface for human and agents to use the data better.
  </p>

