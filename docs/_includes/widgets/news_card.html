{% assign news_by_month = site.news | sort: "date" | reverse | slice: 0, include.limit | group_by_exp: "item", "item.date | date: '%b %Y'" -%}

<div class="my-3 bg-white shadow-sm rounded-xl">
    <h6 class="p-3 mb-0 border-bottom border-gray"><i class="fas fa-rss"></i> News</h6>
    <div class="px-3 pb-1 small">
        {% for month in news_by_month %}
        <div class="media py-1{% unless forloop.first %} border-top border-gray{% endunless %}">
            <div class="mr-3 my-1 text-muted no-break">{{ month.name }}</div>
            <div class="media-body">
                {% for item in month.items %}
                <div class="my-1">{{ item.title }}</div>
                {% endfor %}
            </div>
        </div>
        {% endfor %}
    </div>
</div>
